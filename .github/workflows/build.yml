name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained EXE
        run: dotnet publish RemoveWindowsAI.csproj -c Release -o out/full

      - name: Publish small EXE (needs .NET 8 Desktop Runtime)
        run: dotnet publish RemoveWindowsAI.csproj -c Release -o out/small --self-contained false -p:EnableCompressionInSingleFile=false

      - name: Rename outputs
        shell: pwsh
        run: |
          Move-Item out/full/KanaoRemoveAI.exe out/KanaoRemoveAI.exe
          Move-Item out/small/KanaoRemoveAI.exe out/KanaoRemoveAI-small.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KanaoRemoveAI
          path: out/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
